name: Deploy a Pruebas

on:
  push:
    branches:
      - pruebas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/iamet2026/crm-pruebas
            git config --global --add safe.directory /home/iamet2026/crm-pruebas
            git pull origin pruebas
            # `up -d --force-recreate` arranca el contenedor con docker-entrypoint.sh,
            # que ya corre migrate + collectstatic --clear al iniciar. No se duplica
            # aquí porque la segunda pasada agotaba memoria y mataba el deploy (137).
            sudo docker compose --env-file .env.pruebas -f docker-compose.pruebas.yml up -d --force-recreate web
