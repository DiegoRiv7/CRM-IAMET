{% comment %}
═══ WIDGET OPORTUNIDAD — PLANTILLA INSTANCIABLE (v4) ═══

Refactor Etapa 1 (2026-06): el widget de Oportunidad como componente.
Este <template> se CLONA por cada instancia (hasta 4 a la vez) desde
oportunidad_widget_v2.js. Reglas:

  · CERO ids — todo elemento direccionable usa data-wo="nombre"
    (el JS resuelve con root.querySelector('[data-wo=...]')).
  · CERO handlers inline — acciones via data-action + delegación.

Rediseño v4 (2026-07-31). Dos decisiones que explican el markup:

  · La estructura interna usa el prefijo wo4-*, NO las clases wo-* de
    crm.css. Es a propósito: los cinco temas pintan .wo-header y .wo-card
    con degradados y !important, y este diseño no tiene header de color.
    Con nombres propios el widget queda neutro sin pelearle a nadie.
  · La tira de etapas (12+ pastillas con scroll) se sustituye por barra
    segmentada + el botón "Avanzar a <siguiente>", que es la acción real.
    El salto a una etapa arbitraria — y las ramas — viven en "Ver etapas".

Los widgets satélite (Drive, crear actividad, todas-tareas, conversación,
modal vincular proyecto, confirm tipo) siguen siendo singletons en sus
archivos actuales — el v4 los abre tras fijar el foco (_woCurrentOppId).
{% endcomment %}
{% load static %}
<template id="tplOppWidgetV2">
<div class="widget-overlay opp-v2 opp-v4" data-wo="root" data-widget-title="Oportunidad">
    <div class="widget-card widget-card-lg" data-wo="card">
        <!-- Loading -->
        <div data-wo="loading" style="text-align:center;padding:4rem;color:#6B7280;">
            <svg style="animation:spin 1s linear infinite;width:24px;height:24px;margin:0 auto 1rem;"
                viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2">
                <path d="M12 2v4m0 12v4m-7.07-3.93l2.83-2.83m8.48-8.48l2.83-2.83M2 12h4m12 0h4m-3.93 7.07l-2.83-2.83M7.76 7.76L4.93 4.93" />
            </svg>
            Cargando oportunidad...
        </div>

        <!-- Content (oculto hasta cargar) -->
        <div data-wo="content" style="display:none;flex-direction:column;height:100%;">

            {% comment %}
            ═══ ENCABEZADO ═══
            La franja ocupaba dos renglones (migaja + título) para muy poco dato.
            La franja carga el título con su tipo de venta al lado, y a la
            derecha el ojo de quién la ha visto, la descarga del expediente y
            el cierre. El cliente vive abajo, junto al responsable.
            {% endcomment %}
            <div class="wo4-head wo-header">
                <div class="wo4-head-mid">
                    <!-- Proyecto vinculado como ruta, no como pastilla -->
                    <span class="wo4-crumb-proy" data-wo="proyectoHeader" style="display:none;"></span>
                    <div class="wo4-title-row">
                        <h1 class="wo4-title wo-title" data-wo="title"></h1>
                        <button type="button" class="wo4-tipo" data-wo="typeBadge">Venta runrate</button>
                    </div>
                </div>

                <div class="wo4-head-right">
                    <!-- Ojo: quién ha abierto esta oportunidad -->
                    <button type="button" class="wo4-ojo" data-action="ver-vistas"
                        data-wo="ojoBtn" title="Quién ha visto esta oportunidad">
                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span class="wo4-ojo-avs" data-wo="ojoAvatares"></span>
                        <span class="wo4-ojo-n" data-wo="ojoTotal"></span>
                    </button>

                    <!-- Expediente en PDF. Icono de descarga y no de impresora:
                         lo que hace es abrir el PDF, y de ahi se guarda o se
                         imprime. La impresora prometia una sola de las dos. -->
                    <button type="button" class="wo4-ojo wo4-imprimir" data-action="imprimir-pdf"
                        data-wo="btnImprimir" title="Descargar el expediente en PDF">
                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                    </button>

                    <div class="wo4-win">
                        <button type="button" class="wo4-ic widget-close" data-wo="close" data-action="close" title="Cerrar">
                            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ═══ ETAPA ═══
                 El pipeline vuelve a ser el de siempre: caja gris, pastillas con
                 conectores y flechas de scroll. La versión con los nombres en
                 rectángulos envolvía a dos renglones con 18 etapas y se leía
                 peor. Encima, la línea de contexto (etapa N de M y cuánto lleva
                 sin moverse), que sí es información nueva y útil. -->
            <div class="wo4-etapa" data-wo="pipelineWrap">
                <div class="wo-pipeline-container">
                    <div class="wo-scroll-btn" data-action="pipeline-izq">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" /></svg>
                    </div>
                    <div class="wo-pipeline-scroll" data-wo="pipelineScroll">
                        <div class="wo-pipeline-stages" data-wo="pipelineStages"></div>
                    </div>
                    <div class="wo-scroll-btn" data-action="pipeline-der">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" /></svg>
                    </div>
                </div>
            </div>

            <!-- ═══ CUERPO ═══ -->
            <div class="wo4-body">

                <!-- ── Columna principal ── -->
                <div class="wo4-main">
                    <div class="wo4-duo">
                        <div class="wo4-card wo4-pad">
                            <div class="wo4-chead">
                                <h3>Tareas</h3>
                                <button type="button" class="wo4-link" data-action="nueva-tarea">+ Nueva</button>
                            </div>
                            <div class="wo4-lista" data-wo="tareasList"></div>
                        </div>
                        <div class="wo4-card wo4-pad">
                            <div class="wo4-chead">
                                <h3>Actividades</h3>
                                <button type="button" class="wo4-link" data-wo="btnNuevaActividad" data-action="nueva-actividad">+ Agendar</button>
                            </div>
                            <div class="wo4-lista" data-wo="actividadList"></div>
                        </div>
                    </div>

                    <!-- Conversación: SOLO correos y notas. La bitácora vieja de
                         Bitrix24 sigue accesible en el filtro "Historial", pero ya
                         no entra en "Todo" — metía ruido y las cotizaciones se ven
                         al lado con su fecha. -->
                    <div class="wo4-card wo4-conv">
                        <div class="wo4-conv-head">
                            <div class="wo4-conv-t">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                                <h3>Conversación</h3>
                                <span class="wo4-conv-n" data-wo="convCount"></span>
                                <button type="button" class="wo4-ic" data-action="abrir-conversacion"
                                    title="Abrir conversación completa (responder, menciones, adjuntos)">
                                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                                </button>
                            </div>
                            <div class="wo4-buscar">
                                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
                                <input type="text" data-wo="convSearch" placeholder="Buscar en el expediente">
                            </div>
                            <div class="wo4-segmented">
                                <button type="button" class="wo4-sg is-active" data-conv-filtro="todo">Todo</button>
                                <button type="button" class="wo4-sg" data-conv-filtro="nota">Notas</button>
                                <button type="button" class="wo4-sg" data-conv-filtro="correo">Correos</button>
                                <button type="button" class="wo4-sg" data-conv-filtro="historial" title="Bitácora importada de Bitrix24">Historial</button>
                            </div>
                        </div>
                        <div data-wo="convPinned" style="display:none;"></div>
                        <div class="wo4-feed" data-wo="convFeed"></div>
                        <!-- Barra de respuesta: solo sale al elegir "Responder" en un mensaje -->
                        <div class="wo4-replybar" data-wo="convReplyBar" style="display:none;"></div>
                        {% comment %}
                        Adjuntos en espera, sobre el compositor: lo pegado o
                        elegido se queda aquí con su miniatura hasta que se pulsa
                        enviar, para poder revisarlo y acompañarlo con una nota.
                        Antes salía solo, sin oportunidad de verlo.
                        {% endcomment %}
                        <div class="wo4-pendientes" data-wo="convPend" style="display:none;"></div>
                        <div class="wo4-composer">
                            <button type="button" class="wo4-cic" data-action="nueva-actividad" title="Agendar actividad">
                                <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
                            </button>
                            <input type="file" data-wo="convFile" multiple style="display:none;">
                            <button type="button" class="wo4-cic" data-action="conv-adjuntar" title="Adjuntar archivo">
                                <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                            </button>
                            <button type="button" class="wo4-cic" data-action="conv-correo" title="Enviar correo">
                                <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
                            </button>
                            <input type="text" class="wo4-cinp" data-wo="convInput" placeholder="Escribe una nota…"
                                onkeydown="if(event.key==='Enter'){var b=this.parentNode.querySelector('[data-action=conv-enviar]');if(b)b.click();}">
                            <button type="button" class="wo4-send" data-action="conv-enviar" title="Enviar nota">
                                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ── Lateral: lo de consulta ── -->
                <aside class="wo4-side">
                    <!-- Orden: cifras del trato arriba, luego los papeles (cotizaciones
                         y drive) y hasta abajo las personas. -->
                    <div class="wo4-card wo4-pad" data-wo="infoCard">
                        {% comment %}
                        Monto y utilidad juntos: son las dos cifras que se miran
                        primero. La utilidad sale de los papeles del Drive:
                        suma de las POs del cliente menos suma de las OC que le
                        emitimos a proveedores. Queda en guion mientras no haya
                        POs, porque sin ingreso no hay contra qué medirla.
                        {% endcomment %}
                        <div class="wo4-monto-row">
                            <div class="wo4-monto-i">
                                <span class="wo4-lbl" data-wo="montoLbl">Monto sin IVA (cotización)</span>
                                <div class="wo4-monto" data-wo="monto">$0</div>
                                <span class="wo4-moneda">pesos mexicanos</span>
                            </div>
                            <div class="wo4-monto-i wo4-util" data-wo="utilBox">
                                <span class="wo4-lbl">Utilidad</span>
                                <div class="wo4-util-v" data-wo="utilidadPct">—</div>
                                <span class="wo4-moneda" data-wo="utilidadMonto"></span>
                            </div>
                        </div>

                        <div class="wo4-docs">
                            <div class="wo4-doc">
                                <span class="wo4-lbl">PO</span>
                                <input type="text" class="wo4-doc-inp" data-wo="poNumber" maxlength="15" placeholder="—" />
                            </div>
                            <div class="wo4-doc">
                                <span class="wo4-lbl">Factura</span>
                                <input type="text" class="wo4-doc-inp" data-wo="facturaNumero" maxlength="7" placeholder="—" />
                            </div>
                        </div>

                        <!-- Lo que casi no se consulta, a un clic. Siguen editables:
                             la probabilidad se arrastra y las otras dos son selectores. -->
                        <button type="button" class="wo4-link wo4-vermas" data-action="toggle-info">
                            <span data-wo="infoToggleTxt">Ver más detalles</span>
                            <svg class="wo4-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="wo4-extra" data-wo="infoExtra">
                            <div class="wo4-extra-full">
                                <span class="wo4-lbl">Probabilidad de cierre</span>
                                <div style="display:flex;align-items:center;gap:11px;">
                                    <strong class="wo-prob-value wo4-prob" data-wo="probValue">0%</strong>
                                    <div class="wo-prob-bar wo4-barra" data-wo="probBar" style="flex:1;margin:0;">
                                        <div class="wo-prob-fill" data-wo="probFill" style="width:0%"></div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <span class="wo4-lbl">Producto</span>
                                <div class="wo4-extra-v" data-wo="producto">-</div>
                            </div>
                            <div>
                                <span class="wo4-lbl">Área</span>
                                <div class="wo4-extra-v" data-wo="area">-</div>
                            </div>
                            {% comment %}
                            El mes de cierre baja aquí: la primera línea la ocupan
                            ahora el monto y la utilidad, que son las dos cifras
                            que de verdad se miran. Sigue siendo editable.

                            El cliente ya no se cambia desde aquí: se hace con un
                            clic sobre su nombre en la tarjeta de personas, que
                            abre el buscador.
                            {% endcomment %}
                            <div>
                                <span class="wo4-lbl">Mes de cierre</span>
                                <div class="wo4-extra-v" data-wo="fechaCierre">-</div>
                            </div>
                        </div>

                    </div>

                    <div class="wo4-card wo4-pad">
                        <div class="wo4-chead">
                            <!-- El título expande: muestra todas y saca el buscador -->
                            <button type="button" class="wo4-htitle" data-action="abrir-cotizaciones" title="Ver todas las cotizaciones">
                                <h3>Cotizaciones</h3>
                                <svg class="wo4-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <button type="button" class="wo4-link" data-wo="btnNuevaCot" data-action="nueva-cot">+ Nueva</button>
                        </div>
                        <div data-wo="quoteList"></div>
                    </div>

                    <div class="wo4-card wo4-pad">
                        <div class="wo4-chead">
                            <button type="button" class="wo4-htitle" data-action="abrir-drive" title="Abrir la carpeta completa">
                                <h3>Archivos en Drive</h3>
                                <svg class="wo4-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
                            </button>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <input type="file" data-wo="driveFile" multiple style="display:none;">
                                <button type="button" class="wo4-link" data-action="drive-subir">
                                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 19V5"/><polyline points="5 12 12 5 19 12"/></svg>
                                    Subir
                                </button>
                                <button type="button" class="wo4-ic" data-action="abrir-drive" title="Abrir la carpeta completa">
                                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="wo4-drive" data-wo="driveList"></div>
                    </div>

                    {% comment %}
                    Dos mitades en UNA sola línea: el responsable a la
                    izquierda y el cliente a la derecha, con el contacto colgando
                    debajo en chico. Puestos como tres columnas se envolvían a
                    dos renglones en cuanto el nombre de la empresa era largo.

                    El nombre del cliente es el elemento sobre el que trabaja el
                    autocompletado para cambiarlo, así que ahora se ve y se puede
                    editar de nuevo desde aquí.
                    {% endcomment %}
                    <div class="wo4-card wo4-pad wo4-personas">
                        <div class="wo4-persona" title="Responsable">
                            <span class="wo4-av blue" data-wo="vendedorAvatar"></span>
                            <span class="wo4-persona-n" data-wo="vendedorName"></span>
                        </div>
                        <div class="wo4-persona" title="Cliente y contacto">
                            <span class="wo4-av green" data-wo="clienteAvatarEmp"></span>
                            <span class="wo4-persona-dos">
                                <span class="wo4-persona-n" data-wo="clienteName"></span>
                                <span class="wo4-persona-sub" data-wo="contactoName"></span>
                            </span>
                        </div>
                    </div>

                    {% comment %}
                    Cuadro del trato: permanente, antes solo salía en las de tipo
                    proyecto. El tipo de venta volvió arriba, junto al título.
                    {% endcomment %}
                    <div class="wo4-card wo4-pad" data-wo="proyectoCard">
                        <div class="wo4-chead">
                            <h3>Proyecto</h3>
                            <button type="button" class="wo4-link" data-action="vincular-proyecto">Vincular</button>
                        </div>
                        <div data-wo="proyectoList"></div>
                    </div>
                </aside>
            </div>

            <!-- Save bar (edición inline) -->
            <div class="wo-save-bar" data-wo="saveBar" style="display:none;">
                <button class="wo-save-cancel" data-action="save-cancel" type="button">Cancelar</button>
                <button class="wo-save-confirm" data-wo="saveConfirm" data-action="save-confirm" type="button">Guardar</button>
            </div>
        </div>
    </div>
</div>
</template>
