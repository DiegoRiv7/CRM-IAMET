{% comment %}
═══ WIDGET OPORTUNIDAD V2 — PLANTILLA INSTANCIABLE ═══

Refactor Etapa 1 (2026-06): el widget de Oportunidad como componente.
Este <template> se CLONA por cada instancia (hasta 4 a la vez) desde
oportunidad_widget_v2.js. Reglas:

  · CERO ids — todo elemento direccionable usa data-wo="nombre"
    (el JS resuelve con root.querySelector('[data-wo=...]')).
  · CERO handlers inline — acciones via data-action + delegación.
  · El markup espejea 1:1 las líneas 1-291 de _widget_oportunidad.html
    (legacy). Al llegar a paridad, el markup legacy se retira.

Los widgets satélite (Drive, crear actividad, todas-tareas, conversación,
modal vincular proyecto, confirm tipo) siguen siendo singletons en sus
archivos actuales — el v2 los abre tras fijar el foco (_woCurrentOppId).
{% endcomment %}
<template id="tplOppWidgetV2">
<div class="widget-overlay opp-v2" data-wo="root" data-widget-title="Oportunidad">
    <div class="widget-card widget-card-lg" data-wo="card">
        <!-- Loading -->
        <div data-wo="loading" style="text-align:center;padding:4rem;color:#86868B;">
            <svg style="animation:spin 1s linear infinite;width:24px;height:24px;margin:0 auto 1rem;"
                viewBox="0 0 24 24" fill="none" stroke="#0052D4" stroke-width="2">
                <path
                    d="M12 2v4m0 12v4m-7.07-3.93l2.83-2.83m8.48-8.48l2.83-2.83M2 12h4m12 0h4m-3.93 7.07l-2.83-2.83M7.76 7.76L4.93 4.93" />
            </svg>
            Cargando oportunidad...
        </div>
        <!-- Content (oculto hasta cargar) -->
        <div data-wo="content" style="display:none;flex-direction:column;height:100%;">
            <!-- Header -->
            <div class="wo-header">
                <div class="wo-header-top">
                    <div style="flex:1;min-width:0;">
                        <!-- Proyecto e IDENTIDAD, no metadatos: describen qué ES esta
                             oportunidad, igual que su nombre. Por eso viven aquí y no
                             en la tarjeta de detalles. -->
                        <div class="wo-proy-head" data-wo="proyectoHeader" style="display:none;"></div>
                        <div style="display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap;">
                            <h1 class="wo-title" data-wo="title" style="margin:0;min-width:0;"></h1>
                            <div class="wo-type-badge runrate wo-badge-titulo" data-wo="typeBadge">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                                </svg>
                                <span>VENTA RUNRATE</span>
                            </div>
                            <button type="button" data-wo="btnAsistente" data-action="abrir-asistente" class="wo-asist-btn-title"
                                title="Asistente AI de esta oportunidad"
                                style="background:transparent;border:none;cursor:pointer;padding:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform 0.15s ease;">
                                <span class="asist-orb asist-orb--static" aria-hidden="true" style="width:34px;height:34px;">
                                    <span class="asist-orb-core"></span>
                                    <span class="asist-orb-ring asist-orb-ring--horiz"></span>
                                    <span class="asist-orb-ring asist-orb-ring--vert"></span>
                                </span>
                            </button>
                        </div>
                    </div>
                    <button type="button" class="widget-close" data-wo="close" data-action="close">&times;</button>
                </div>
            </div>

            <div class="wo-tab-panel active">
                <!-- Pipeline (etapas como pestañas colgadas de la barra del header) -->
                <div class="wo-pipeline" data-wo="pipelineWrap">
                    <div class="wo-pipeline-container">
                        <div class="wo-scroll-btn" data-action="pipeline-izq">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M15 18l-6-6 6-6" />
                            </svg>
                        </div>
                        <div class="wo-pipeline-scroll" data-wo="pipelineScroll">
                            <div class="wo-pipeline-stages" data-wo="pipelineStages"></div>
                        </div>
                        <div class="wo-scroll-btn" data-action="pipeline-der">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M9 18l6-6-6-6" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Content Grid
                     Rejilla 2×3 explícita (no dos columnas anidadas) para que las
                     filas se alineen entre sí: Info ↔ Tareas quedan del mismo alto,
                     y Cotizaciones ↔ Conversación arrancan a la misma altura. -->
                <div class="wo-content">
                    <div class="wo-grid">

                            <!-- Info card compacta (con Vendedor y Cliente integrados) -->
                            <!-- Detalles: dato de consulta, no de trabajo. Se queda al
                                 pie con lo que de verdad se mira (monto, cierre, PO,
                                 facturas, vendedor, cliente) y lo demás tras "Ver más". -->
                            <div class="wo-card wo-g-info" data-wo="infoCard">
                                <div class="wo-info-head">
                                    <h3 class="wo-section-title">Detalles</h3>
                                    <button class="wo-btn-mini" data-action="toggle-info" type="button">
                                        <span data-wo="infoToggleTxt">Ver más</span>
                                        <svg class="wo-info-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
                                    </button>
                                </div>
                                <div class="wo-info-strip">
                                    <div class="wo-info-item">
                                        <span class="wo-info-label">Monto</span>
                                        <span class="wo-info-value" data-wo="monto">$0</span>
                                    </div>
                                    <div class="wo-info-item">
                                        <span class="wo-info-label">Fecha de Cierre</span>
                                        <span class="wo-info-value medium" data-wo="fechaCierre">-</span>
                                    </div>
                                    <div class="wo-info-item">
                                        <span class="wo-info-label">PO</span>
                                        <input type="text" class="wo-doc-input" data-wo="poNumber" maxlength="15" placeholder="—" />
                                    </div>
                                    <div class="wo-info-item wo-doc-fact">
                                        <span class="wo-info-label">Facturas</span>
                                        <div class="wo-fact-row">
                                            <input type="text" class="wo-doc-input" data-wo="facturaNumero" maxlength="7" placeholder="—" />
                                        </div>
                                    </div>
                                </div>
                                <!-- Vendedor + Cliente, bajo la tira -->
                                <div class="wo-divider wo-info-sep"></div>
                                <div class="wo-info-people">
                                    <div class="wo-stakeholder">
                                        <div class="wo-stakeholder-label">Vendedor</div>
                                        <div class="wo-stakeholder-info">
                                            <div class="wo-avatar blue" data-wo="vendedorAvatar"></div>
                                            <div style="min-width:0;">
                                                <div class="wo-stakeholder-name" data-wo="vendedorName" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="wo-stakeholder" style="border-left:1px solid #E5E5EA;padding-left:0.9rem;">
                                        <div class="wo-stakeholder-label">Cliente</div>
                                        <div class="wo-stakeholder-info">
                                            <div class="wo-avatar purple" data-wo="clienteAvatar"></div>
                                            <div style="min-width:0;">
                                                <div class="wo-stakeholder-name" data-wo="clienteName" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
                                                <div class="wo-stakeholder-company" data-wo="contactoName" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Lo que casi no se consulta, pero sigue siendo editable
                                     a un clic: probabilidad se arrastra, producto y área
                                     son desplegables. -->
                                <div class="wo-info-extra" data-wo="infoExtra">
                                    <div class="wo-info-item">
                                        <span class="wo-info-label">Producto</span>
                                        <span class="wo-info-value medium" data-wo="producto">-</span>
                                    </div>
                                    <div class="wo-info-item">
                                        <span class="wo-info-label">Area</span>
                                        <span class="wo-info-value medium" data-wo="area">-</span>
                                    </div>
                                    <div class="wo-info-item">
                                        <span class="wo-info-label">Probabilidad</span>
                                        <div style="display:flex;align-items:center;gap:0.5rem;">
                                            <span class="wo-prob-value" data-wo="probValue">0%</span>
                                            <div class="wo-prob-bar" data-wo="probBar" style="flex:1;margin:0;">
                                                <div class="wo-prob-fill" data-wo="probFill" style="width:0%"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Cotizaciones + Drive: los dos son "los papeles" de la
                                 oportunidad, así que viven en la misma card. El Drive va
                                 abierto (primeros archivos a la vista) con atajo para
                                 subir y para abrir la carpeta completa. -->
                            <div class="wo-card wo-g-cot">
                                <div class="wo-section-header">
                                    <h3 class="wo-section-title">Cotizaciones</h3>
                                    <button class="wo-btn-new" data-wo="btnNuevaCot" data-action="nueva-cot" type="button">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="12" y1="5" x2="12" y2="19" />
                                            <line x1="5" y1="12" x2="19" y2="12" />
                                        </svg>
                                        Nueva
                                    </button>
                                </div>
                                <div class="wo-quote-list" data-wo="quoteList">
                                    <div class="wo-empty">Sin cotizaciones aun</div>
                                </div>

                                <div class="wo-drive-block">
                                    <div class="wo-drive-head">
                                        <!-- El título entero es el disparador de expandir:
                                             ícono o palabra, sin botón aparte. -->
                                        <h4 class="wo-head-expand" data-action="abrir-drive" title="Abrir la carpeta completa">
                                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z" />
                                            </svg>
                                            Archivos en Drive
                                        </h4>
                                        <div style="display:flex;align-items:center;gap:6px;">
                                            <input type="file" data-wo="driveFile" multiple style="display:none;">
                                            <button class="wo-btn-solid" data-action="drive-subir" type="button" title="Subir archivo">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                                                    <line x1="12" y1="5" x2="12" y2="19" />
                                                    <line x1="5" y1="12" x2="19" y2="12" />
                                                </svg>
                                                Subir
                                            </button>
                                        </div>
                                    </div>
                                    <div class="wo-drive-list" data-wo="driveList"></div>
                                </div>
                            </div>

                            <!-- Tareas | Actividades: la card partida a la mitad, lado a lado.
                                 Son cosas distintas (las actividades llevan su propio
                                 formulario y van al calendario), así que cada mitad
                                 tiene su lista y su botón. -->
                            <div class="wo-card wo-g-tareas">
                                <div class="wo-ta-split">
                                    <section class="wo-ta-col">
                                        <div class="wo-ta-head">
                                            <h3>Tareas</h3>
                                            <button class="wo-btn-mini" data-action="nueva-tarea" type="button" title="Nueva tarea">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                                                    <line x1="12" y1="5" x2="12" y2="19" />
                                                    <line x1="5" y1="12" x2="19" y2="12" />
                                                </svg>
                                                Nueva
                                            </button>
                                        </div>
                                        <div class="wo-tareas-inline-list" data-wo="tareasList"></div>
                                    </section>
                                    <section class="wo-ta-col">
                                        <div class="wo-ta-head">
                                            <h3>Actividades</h3>
                                            <button class="wo-btn-mini" data-wo="btnNuevaActividad" data-action="nueva-actividad"
                                                type="button" title="Nueva actividad">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                                                    <line x1="12" y1="5" x2="12" y2="19" />
                                                    <line x1="5" y1="12" x2="19" y2="12" />
                                                </svg>
                                                Nueva
                                            </button>
                                        </div>
                                        <div class="wo-tareas-inline-list" data-wo="actividadList"></div>
                                    </section>
                                </div>
                            </div>

                            <!-- Conversación embebida (expediente vivo) -->
                            <div class="wo-card wo-g-conv" style="display:flex;flex-direction:column;min-height:340px;padding-bottom:0.75rem;">
                                <div class="wo-section-header" style="margin-bottom:0.5rem;">
                                    <!-- Igual que el Drive: el título expande, sin botón aparte. -->
                                    <h3 class="wo-section-title wo-head-expand" data-action="abrir-conversacion"
                                        title="Abrir conversación completa">
                                        <svg width="16" height="16" fill="none" stroke="#0052D4" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                                        Conversación
                                    </h3>
                                </div>
                                <div style="display:flex;align-items:center;gap:6px;margin-bottom:0.55rem;flex-wrap:wrap;">
                                    <div style="flex:1;min-width:130px;display:flex;align-items:center;gap:6px;background:#F2F2F7;border-radius:9px;padding:5px 9px;">
                                        <svg width="12" height="12" fill="none" stroke="#86868B" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
                                        <input type="text" data-wo="convSearch" placeholder="Buscar en el expediente"
                                            style="flex:1;min-width:0;border:none;background:none;outline:none;font-size:0.76rem;font-family:inherit;color:#1D1D1F;">
                                    </div>
                                    <div style="display:flex;gap:3px;">
                                        <button type="button" class="wo-conv-chip is-active" data-conv-filtro="todo">Todo</button>
                                        <button type="button" class="wo-conv-chip" data-conv-filtro="nota">Notas</button>
                                        <button type="button" class="wo-conv-chip" data-conv-filtro="correo">Correos</button>
                                        <button type="button" class="wo-conv-chip" data-conv-filtro="historial">Historial</button>
                                    </div>
                                </div>
                                <div data-wo="convPinned" style="display:none;"></div>
                                <div data-wo="convFeed" style="flex:1;min-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 6px;">
                                    <div class="wo-empty" style="font-size:0.78rem;">Cargando conversación…</div>
                                </div>
                                <!-- Composer: agendar actividad · adjuntar archivo · enviar correo
                                     (mismas acciones que la barra del overlay completo). -->
                                <div style="display:flex;align-items:center;gap:6px;margin-top:0.55rem;flex-shrink:0;">
                                    <button type="button" class="wo-conv-act" data-action="nueva-actividad" title="Agendar actividad">
                                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                            <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                        </svg>
                                    </button>
                                    <input type="file" data-wo="convFile" multiple accept="*/*" style="display:none;">
                                    <button type="button" class="wo-conv-act" data-action="conv-adjuntar" title="Adjuntar archivo">
                                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
                                        </svg>
                                    </button>
                                    <button type="button" class="wo-conv-act is-mail" data-action="conv-correo" title="Enviar correo">
                                        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="3" y="5" width="18" height="14" rx="2" />
                                            <polyline points="3 7 12 13 21 7" />
                                        </svg>
                                    </button>
                                    <input type="text" data-wo="convInput" placeholder="Escribe una nota…"
                                        onkeydown="if(event.key==='Enter'){var b=this.parentNode.querySelector('[data-action=conv-enviar]');if(b)b.click();}"
                                        style="flex:1;min-width:0;border:1px solid #E5E5EA;border-radius:999px;padding:8px 14px;font-size:0.8rem;font-family:inherit;outline:none;background:#fff;color:#1D1D1F;">
                                    <button data-action="conv-enviar" type="button" title="Enviar nota"
                                        style="width:34px;height:34px;border-radius:50%;background:#0052D4;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                    </button>
                                </div>
                            </div>
                    </div>
                </div>
            </div>

            <!-- Save bar (edición inline) -->
            <div class="wo-save-bar" data-wo="saveBar" style="display:none;">
                <button class="wo-save-cancel" data-action="save-cancel" type="button">Cancelar</button>
                <button class="wo-save-confirm" data-wo="saveConfirm" data-action="save-confirm" type="button">Guardar</button>
            </div>
        </div>
    </div>
</div>
</template>
