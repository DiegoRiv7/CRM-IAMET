{# ═══ WIDGET: CERTIFICACIÓN — Detalle (read-only) ═══ #}
<div class="widget-overlay" id="widgetCertDetalle" style="z-index:10450;display:none;"
     onclick="if(event.target===this){window.certificacionDetalleCerrar();}">
    <div class="widget-card widget-card-lg cert-det-card">
        <div id="certDetLoading" style="text-align:center;padding:3rem;color:#86868B;">
            <svg style="animation:spin 1s linear infinite;width:22px;height:22px;margin:0 auto 0.75rem;"
                 viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2">
                <path d="M12 2v4m0 12v4m-7.07-3.93l2.83-2.83m8.48-8.48l2.83-2.83M2 12h4m12 0h4m-3.93 7.07l-2.83-2.83M7.76 7.76L4.93 4.93"/>
            </svg>
            Cargando certificación…
        </div>

        <div id="certDetContent" style="display:none;">
            <div class="cert-det-header">
                <div class="cert-det-header-info">
                    <div class="cert-det-badge"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg> Certificación</div>
                    <h2 class="cert-det-title" id="certDetTitle"></h2>
                    <div class="cert-det-sub">
                        <span class="cert-det-marca-pill" id="certDetMarca"></span>
                        <span id="certDetNivel" style="color:#6B7280;font-size:0.82rem;font-weight:600;display:none;"></span>
                        <span id="certDetNumero" style="color:#6B7280;font-size:0.82rem;display:none;"></span>
                    </div>
                </div>
                <div class="cert-det-actions">
                    <button type="button" class="cert-det-btn cert-det-btn-edit" id="certDetEdit">
                        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
                        Editar
                    </button>
                    <button type="button" class="cert-det-btn" id="certDetClose" title="Cerrar">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>

            <div class="cert-det-body">
                {# Persona certificada #}
                <div class="cert-det-block">
                    <div class="cert-det-lbl">Persona certificada</div>
                    <div class="cert-det-persona">
                        <span class="cert-det-avatar" id="certDetAvatar"></span>
                        <span id="certDetPersona" style="font-size:0.95rem;font-weight:600;color:#1d1d1f;"></span>
                    </div>
                </div>

                {# Fechas #}
                <div class="cert-det-grid">
                    <div class="cert-det-block">
                        <div class="cert-det-lbl">Obtenida</div>
                        <div class="cert-det-val" id="certDetFechaObt">—</div>
                    </div>
                    <div class="cert-det-block">
                        <div class="cert-det-lbl">Vencimiento</div>
                        <div class="cert-det-val" id="certDetFechaVenc">—</div>
                    </div>
                </div>

                {# Notas #}
                <div class="cert-det-block" id="certDetNotasBlock" style="display:none;">
                    <div class="cert-det-lbl">Notas</div>
                    <div class="cert-det-val" id="certDetNotas" style="white-space:pre-wrap;"></div>
                </div>

                {# Archivos #}
                <div class="cert-det-block">
                    <div class="cert-det-lbl">Comprobantes (<span id="certDetArchivosCount">0</span>)</div>
                    <div id="certDetArchivos" class="cert-det-archivos">
                        <div class="cert-files-empty">Sin archivos.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    var overlay = document.getElementById('widgetCertDetalle');
    if (!overlay) return;

    function _esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function abrir(certId){
        overlay.style.display = 'flex';
        document.getElementById('certDetLoading').style.display = '';
        document.getElementById('certDetContent').style.display = 'none';
        fetch('/app/api/certificaciones/' + certId + '/')
            .then(function(r){ return r.json(); })
            .then(function(data){
                var c = data && data.certificacion;
                if (!c) return cerrar();
                document.getElementById('certDetTitle').textContent = c.nombre;
                document.getElementById('certDetMarca').textContent = (c.marca || '').charAt(0) + (c.marca || '').slice(1).toLowerCase();

                var nivelEl = document.getElementById('certDetNivel');
                if (c.nivel_display){
                    nivelEl.textContent = '· ' + c.nivel_display;
                    nivelEl.style.display = '';
                } else { nivelEl.style.display = 'none'; }

                var numEl = document.getElementById('certDetNumero');
                if (c.numero){
                    numEl.textContent = '· #' + c.numero;
                    numEl.style.display = '';
                } else { numEl.style.display = 'none'; }

                document.getElementById('certDetPersona').textContent = c.usuario_nombre || '';
                document.getElementById('certDetAvatar').textContent = c.usuario_iniciales || '?';

                document.getElementById('certDetFechaObt').textContent = c.fecha_obtencion_display || '—';
                var vEl = document.getElementById('certDetFechaVenc');
                if (c.fecha_vencimiento_display){
                    vEl.textContent = c.fecha_vencimiento_display;
                    if (c.estado_vencimiento === 'vencida') {
                        vEl.style.color = '#DC2626';
                        vEl.textContent += ' · Vencida';
                    } else if (c.estado_vencimiento === 'por_vencer') {
                        vEl.style.color = '#B45309';
                        vEl.textContent += ' · Por vencer';
                    } else {
                        vEl.style.color = '';
                    }
                } else {
                    vEl.textContent = 'Sin vencimiento';
                    vEl.style.color = '#9CA3AF';
                }

                var notasBlock = document.getElementById('certDetNotasBlock');
                if (c.notas && c.notas.trim()){
                    document.getElementById('certDetNotas').textContent = c.notas;
                    notasBlock.style.display = '';
                } else {
                    notasBlock.style.display = 'none';
                }

                var archivos = c.archivos || [];
                document.getElementById('certDetArchivosCount').textContent = archivos.length;
                var listEl = document.getElementById('certDetArchivos');
                if (!archivos.length){
                    listEl.innerHTML = '<div class="cert-files-empty">Sin archivos.</div>';
                } else {
                    listEl.innerHTML = archivos.map(function(a){
                        if (a.es_imagen){
                            return '<a href="'+ a.url +'" target="_blank" rel="noopener" class="cert-det-archivo cert-det-archivo--img">'
                                + '<img src="'+ a.url +'" alt="'+ _esc(a.nombre) +'">'
                                + '<span class="cert-det-archivo-name">'+ _esc(a.nombre) +'</span>'
                                + '</a>';
                        }
                        return '<a href="'+ a.url +'" target="_blank" rel="noopener" class="cert-det-archivo cert-det-archivo--pdf">'
                            + '<span class="cert-det-archivo-ico">'+ (a.es_pdf ? 'PDF' : (a.extension || '·').toUpperCase()) +'</span>'
                            + '<span class="cert-det-archivo-name">'+ _esc(a.nombre) +'</span>'
                            + '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;color:#9CA3AF;"><path d="M7 17L17 7M7 7h10v10"/></svg>'
                            + '</a>';
                    }).join('');
                }

                document.getElementById('certDetEdit').onclick = function(){
                    cerrar();
                    if (typeof window.certificacionFormAbrir === 'function') window.certificacionFormAbrir(certId);
                };

                document.getElementById('certDetLoading').style.display = 'none';
                document.getElementById('certDetContent').style.display = '';
            }).catch(function(){
                cerrar();
            });
    }
    function cerrar(){
        overlay.style.display = 'none';
    }

    document.getElementById('certDetClose').addEventListener('click', cerrar);
    document.addEventListener('keydown', function(e){
        if (overlay.style.display !== 'none' && e.key === 'Escape') cerrar();
    });

    window.certificacionDetalleAbrir = abrir;
    window.certificacionDetalleCerrar = cerrar;
})();
</script>
