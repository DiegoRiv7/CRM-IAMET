<!--
═══════════════════════════════════════════════════════════════════════════
 WIDGET: AVANCE DE ETAPA (modal bloqueante)
 Se abre cuando el responsable de una oportunidad cierra una tarea cuya
 regla de automatización tiene `avanzar_etapa_al_completar=True` y la
 siguiente etapa tiene reglas que crearán nuevas tareas.

 El usuario tiene que describir cada próxima tarea antes de poder confirmar
 el avance. No tiene botón de cerrar, no se cierra con ESC, no se cierra
 al click-fuera.
═══════════════════════════════════════════════════════════════════════════
-->
<div class="widget-overlay" id="widgetAvanceEtapa" style="z-index:11500;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,0.55);backdrop-filter:blur(6px);">
    <div class="wae-card" style="background:#fff;border-radius:18px;width:min(640px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 80px -10px rgba(15,23,42,0.45);overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;">
        <!-- Header -->
        <header style="padding:22px 26px 16px;border-bottom:1px solid rgba(0,0,0,0.06);background:linear-gradient(180deg,#fafbff 0%,#fff 100%);">
            <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg width="22" height="22" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
                </div>
                <div style="flex:1;min-width:0;">
                    <h2 style="margin:0;font-size:1.08rem;font-weight:700;color:#0F172A;letter-spacing:-0.01em;">Antes de avanzar de etapa…</h2>
                    <p style="margin:4px 0 0;font-size:0.82rem;color:#64748B;line-height:1.4;" id="waeSubtitle">
                        Describe cada próxima tarea antes de confirmar el avance.
                    </p>
                </div>
            </div>
            <!-- Etapa actual → etapa siguiente -->
            <div style="display:flex;align-items:center;gap:10px;margin-top:14px;font-size:0.78rem;">
                <span style="padding:5px 12px;border-radius:999px;background:#eef2ff;color:#4338ca;font-weight:600;" id="waeEtapaActual">—</span>
                <svg width="14" height="14" fill="none" stroke="#94A3B8" stroke-width="2.4" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                <span style="padding:5px 12px;border-radius:999px;background:#dcfce7;color:#15803d;font-weight:600;" id="waeEtapaSiguiente">—</span>
                <span style="margin-left:auto;color:#94A3B8;font-size:0.74rem;" id="waeOppNombre"></span>
            </div>
        </header>

        <!-- Lista de próximas tareas para describir -->
        <main style="flex:1;overflow-y:auto;padding:18px 26px;" id="waeListContainer">
            <!-- Inyectado dinámicamente -->
        </main>

        <!-- Footer / acciones -->
        <footer style="padding:14px 26px 18px;border-top:1px solid rgba(0,0,0,0.05);background:#fafbff;display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <div style="font-size:0.74rem;color:#94A3B8;" id="waeFooterHint">Completa todas las descripciones para continuar.</div>
            <button type="button" id="waeConfirmBtn" disabled
                    style="padding:10px 22px;border:none;border-radius:10px;background:linear-gradient(180deg,#3b82f6 0%,#2563eb 100%);color:#fff;font-size:0.88rem;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px -2px rgba(59,130,246,0.4);opacity:0.55;transition:opacity 0.15s;">
                Confirmar y avanzar
            </button>
        </footer>
    </div>
</div>
