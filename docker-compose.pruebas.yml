services:
  web:
    build: .
    restart: unless-stopped
    container_name: crm-pruebas-web
    volumes:
      - .:/app
      - media_pruebas:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8001:8000"
    env_file:
      - .env.pruebas
    depends_on:
      - db
    environment:
      DB_HOST: db
    # 1 solo worker (default) serializaba TODAS las requests → en cada carga
    # el navegador dispara ~10 fetches y se encolaban tras el más lento,
    # provocando 504 hasta en imágenes estáticas. gthread = varios slots
    # concurrentes con poca RAM (ideal para vistas I/O-bound contra MySQL).
    command: gunicorn cartera_clientes.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 8 --worker-class gthread --timeout 90 --max-requests 1000 --max-requests-jitter 200
    deploy:
      resources:
        limits:
          memory: 1024m
        reservations:
          memory: 256m
    networks:
      - pruebas_net

  # Worker de correo (Fase 2): sync de dos vías CRM⇄IMAP cada 3 minutos.
  # entrypoint directo (sin docker-entrypoint.sh) para NO repetir
  # migrate/collectstatic — de eso ya se encarga el contenedor web.
  mailsync:
    build: .
    restart: unless-stopped
    container_name: crm-pruebas-mailsync
    volumes:
      - .:/app
      - media_pruebas:/app/media
    env_file:
      - .env.pruebas
    depends_on:
      - db
      - web
    environment:
      DB_HOST: db
      PYTHONUNBUFFERED: "1"
    entrypoint: python manage.py sincronizar_correo --loop 180
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    networks:
      - pruebas_net

  db:
    image: mysql:8.0
    restart: unless-stopped
    container_name: crm-pruebas-db
    volumes:
      - db_pruebas:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - pruebas_net

volumes:
  db_pruebas:
  media_pruebas:

networks:
  pruebas_net:
    driver: bridge
