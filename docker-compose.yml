version: '3.8'

services:
  web:
    build: .
    volumes:
      - .:/app # Monta el directorio actual para desarrollo (opcional para producción)
      - media_files:/app/media # Volumen persistente para archivos media
    ports:
      - "8000:8000"
    env_file:
      - .env # Carga variables de entorno desde el archivo .env
    depends_on:
      - db
    environment:
      # Sobrescribe DB_HOST para el entorno de Docker Compose para usar el nombre del servicio
      DB_HOST: db
    # 1 solo worker (default) serializaba TODAS las requests → 504 en cascada
    # bajo carga. gthread = varios slots concurrentes con poca RAM (ideal para
    # vistas I/O-bound a MySQL). Requiere recrear el contenedor (up -d) al
    # desplegar, no basta restart.
    command: gunicorn cartera_clientes.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 8 --worker-class gthread --timeout 240 --max-requests 1000 --max-requests-jitter 200
    # <<-- ESTA LÍNEA 'deploy:' DEBE TENER SOLO 2 ESPACIOS DE INDENTACIÓN -->>


    deploy:
      resources:
        limits:
          memory: 2084m  # Intenta con 512MB
        reservations:
          memory: 512m # Puedes reservar un mínimo de memoria también
    networks:
      - nginx_default

  db:
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql # Volumen de datos persistente para la base de datos
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - nginx_default

volumes:
  db_data: # Define el volumen nombrado para la persistencia de la base de datos
  # ════════════════════════════════════════════════════════════════════
  # ⚠️ HANDOFF CRÍTICO — NO TOCAR este volumen sin entender:
  #
  # media_files apunta a un volumen Docker EXISTENTE en el servidor
  # (crm-iamet_media_files, ~9.9GB con miles de archivos del Drive de
  # oportunidades descargados de Bitrix24).
  #
  # Si quitas `external: true` o cambias el `name:`, docker-compose
  # crea un volumen NUEVO vacío con otro nombre (ej.
  # gesti-n-de-ventas_media_files) y el contenedor monta ESE volumen
  # vacío. Los archivos reales NO se pierden (siguen en
  # crm-iamet_media_files), pero el contenedor deja de verlos →
  # avatares rotos, archivos del Drive 404, PDFs perdidos.
  #
  # Recuperación si pasa: poner external: true + name: crm-iamet_media_files
  # de vuelta y reiniciar el contenedor.
  # ════════════════════════════════════════════════════════════════════
  media_files:
    external: true
    name: crm-iamet_media_files  # Volumen REAL con todo el Drive de oportunidades (~9.9GB)

# Añade esta sección al final del archivo
networks:
  nginx_default:
    external: true